<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>for you</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--sf:#FFFCF2;--tx:#2B2416;--mu:#7A6E57;--br:#9A7209;--ac:#8A6A0A;--ln:#EBDDB0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.8}
.wrap{max-width:1050px;margin:0 auto;padding:0 20px}
header{background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:1.8rem;color:var(--br);direction:ltr;display:block;padding:10px 0}
.hero{padding:50px 0 30px}
.hero h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1.3;color:var(--br)}
.hero p{color:var(--mu);margin-top:10px}
.btn{display:inline-block;background:var(--br);color:#fff;padding:8px 22px;border-radius:10px;border:0;cursor:pointer;font:inherit;font-weight:700;text-decoration:none}
.btn.sm{padding:2px 14px;font-size:.85rem}
.btn.gr{background:var(--mu)}
.btn:disabled{opacity:.5}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin:16px 0}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{font:inherit;cursor:pointer;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:999px;padding:2px 16px}
.cats button.on{background:var(--br);color:#fff;border-color:var(--br)}
input,textarea{font:inherit;width:100%;padding:8px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.th{aspect-ratio:1;background:var(--ln);display:flex;align-items:center;justify-content:center;font-size:3rem}
.th img{width:100%;height:100%;object-fit:cover}
.in{padding:12px 14px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.in p{color:var(--mu);font-size:.9rem;flex:1}
.pr{font-weight:800;color:var(--ac);font-size:1.1rem}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 0}
.setup{grid-column:1/-1;background:#FFF3CD;border:2px solid var(--br);border-radius:14px;padding:18px;text-align:center}
#admin{display:none;margin:40px 0;padding:22px;background:var(--sf);border:2px solid var(--br);border-radius:14px}
#admin h2,#admin h3{color:var(--br);margin-bottom:10px}
.f{display:grid;gap:10px;max-width:480px;margin-bottom:24px}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.row span{flex:1}
.note{color:var(--mu);font-size:.9rem;margin-bottom:12px}
#lbox{display:none;max-width:340px;margin:30px auto 0;padding:18px;background:var(--sf);border:2px solid var(--br);border-radius:14px;text-align:center}
#lbox input{margin:6px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--br);color:#fff;padding:10px 22px;border-radius:10px;font-weight:700;display:none;z-index:20;max-width:90%;text-align:center}
footer{margin-top:30px;padding:22px 0;text-align:center;color:var(--mu);border-top:1px solid var(--ln);font-size:.9rem}
footer a{cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<header><div class="wrap"><span class="logo">for you</span></div></header>

<main class="wrap">
  <div class="hero">
    <h1>كل ما تحتاجه،<br>جاهز لك</h1>
    <p>تصفح منتجاتنا واطلب مباشرة عبر واتساب.</p>
  </div>

  <section id="products">
    <div class="tools">
      <div class="cats" id="cats"></div>
      <input id="search" type="search" placeholder="ابحث عن منتج" style="max-width:240px">
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="admin">
    <h2>لوحة التحكم</h2>
    <p class="note">المنتجات تُحفظ على الإنترنت وتظهر لكل الزبائن مباشرة.</p>
    <h3 id="ftitle">إضافة منتج</h3>
    <div class="f">
      <input id="pname" placeholder="اسم المنتج">
      <input id="pcat" placeholder="الفئة (مثال: عطور)" list="catlist">
      <datalist id="catlist"></datalist>
      <input id="pprice" type="number" inputmode="decimal" placeholder="السعر">
      <textarea id="pdesc" rows="2" placeholder="وصف قصير"></textarea>
      <div>صورة المنتج</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn" id="pcam">📷 التقاط صورة</button>
        <button type="button" class="btn gr" id="pgal">🖼️ اختيار من المعرض</button>
      </div>
      <input id="fgal" type="file" accept="image/*" hidden>
      <input id="fcam" type="file" accept="image/*" capture="environment" hidden>
      <img id="pprev" alt="معاينة الصورة" style="display:none;width:120px;height:120px;object-fit:cover;border-radius:10px">
      <div><button class="btn" id="psave">حفظ المنتج</button>
      <button class="btn gr" id="pcancel" style="display:none">إلغاء التعديل</button></div>
    </div>

    <h3>المنتجات الحالية</h3>
    <div id="plist" style="margin-bottom:24px"></div>

    <h3>الإعدادات</h3>
    <div class="f">
      <input id="swa" placeholder="رقم واتساب (مثال 01025046028)">
      <input id="scur" placeholder="العملة (مثال: ج.م)">
      <button class="btn" id="ssave">حفظ الإعدادات</button>
    </div>

    <h3>نسخة احتياطية</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="exp">تصدير المنتجات</button>
      <label class="btn gr">استيراد<input id="imp" type="file" accept=".json,application/json" hidden></label>
      <button class="btn gr" id="logout">تسجيل الخروج</button>
    </div>
  </section>
</main>

<div id="lbox">
  <label for="lmail">البريد الإلكتروني</label>
  <input id="lmail" type="email" autocomplete="username" dir="ltr">
  <label for="lpass">كلمة المرور</label>
  <input id="lpass" type="password" autocomplete="current-password" dir="ltr">
  <button class="btn" id="lgo" style="margin-top:8px">دخول</button>
</div>
<div id="toast" role="status"></div>
<footer>© <span id="yr"></span> for you · <a id="login">دخول المالك</a></footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, query, orderBy, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ===== الصق إعدادات Firebase هنا (بدل القيم التي تبدأ بـ PASTE) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCw2dt1W-hYTc5xaZp-RDMkaQY4D-1ZeDU",
  authDomain: "for-you-35f96.firebaseapp.com",
  projectId: "for-you-35f96",
  storageBucket: "for-you-35f96.firebasestorage.app",
  messagingSenderId: "599135827406",
  appId: "1:599135827406:web:d2b25d3fb40440cc47679f",
  measurementId: "G-7YXMEBW5MJ"
};
/* ==================================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('ar-EG');
const okImg = s => typeof s === "string" && /^data:image\//.test(s);
const configured = !String(firebaseConfig.apiKey).startsWith("PASTE");

let products = [], settings = { whatsapp: "201025046028", currency: "ج.م" };
let cat = "الكل", editId = null, user = null, pending = null, busy = false, tt, db, auth;

function toast(m) {
  const t = $('toast'); t.textContent = m; t.style.display = "block";
  clearTimeout(tt); tt = setTimeout(() => t.style.display = "none", 3500);
}
function fbErr(e) {
  const c = (e && e.code) || "";
  if (c.includes("permission-denied")) return "ليس لديك صلاحية الحفظ. تأكد من تسجيل الدخول ومن قواعد Firestore.";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found") || c.includes("invalid-email")) return "البريد أو كلمة المرور غير صحيحة.";
  if (c.includes("too-many-requests")) return "محاولات كثيرة. انتظر قليلًا ثم حاول مرة أخرى.";
  if (c.includes("unavailable") || c.includes("network")) return "تحقق من اتصال الإنترنت.";
  return "حدث خطأ: " + (c || (e && e.message) || "غير معروف");
}

/* ---------- العرض ---------- */
const wa = t => `https://wa.me/${settings.whatsapp}?text=${encodeURIComponent(t)}`;

function render() {
  if (!configured) {
    $('grid').innerHTML = `<div class="setup"><b>الموقع غير مربوط بقاعدة البيانات بعد.</b><br>افتح الملف والصق إعدادات Firebase في الجزء المخصص لها.</div>`;
    return;
  }
  const cats = ["الكل", ...new Set(products.map(p => p.category).filter(Boolean))];
  $('cats').innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c; if (c === cat) b.className = "on";
    b.onclick = () => { cat = c; render(); };
    $('cats').appendChild(b);
  });
  $('catlist').innerHTML = cats.slice(1).map(c => `<option value="${esc(c)}">`).join("");

  const q = $('search').value.trim();
  const list = products.filter(p => (cat === "الكل" || p.category === cat) && ((p.name || "") + (p.desc || "")).includes(q));
  $('grid').innerHTML = list.length ? list.map(p => `
    <article class="card">
      <div class="th">${okImg(p.image) ? `<img src="${p.image}" alt="${esc(p.name)}" loading="lazy">` : "🎁"}</div>
      <div class="in">
        <h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p>
        <div class="pr">${fmt(p.price)} ${esc(settings.currency)}</div>
        <a class="btn" target="_blank" rel="noopener" style="text-align:center;margin-top:8px"
           href="${wa(`مرحبًا، أريد طلب: ${p.name} (${fmt(p.price)} ${settings.currency})`)}">اطلب عبر واتساب</a>
      </div>
    </article>`).join("")
    : `<p class="empty">${products.length ? "لا توجد منتجات مطابقة." : "لم تُضف منتجات بعد."}</p>`;

  if (user) {
    $('plist').innerHTML = products.map(p => `
      <div class="row"><span>${esc(p.name)} — ${fmt(p.price)}</span>
        <button class="btn sm" data-e="${esc(p.id)}">تعديل</button>
        <button class="btn sm gr" data-d="${esc(p.id)}">حذف</button></div>`).join("") || "لا توجد منتجات.";
  }
}

/* ---------- معالجة الصورة ---------- */
function viaImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    const t = setTimeout(() => { URL.revokeObjectURL(u); rej(new Error("timeout")); }, 20000);
    im.onload = () => { clearTimeout(t); res({ el: im, w: im.naturalWidth, h: im.naturalHeight, done: () => URL.revokeObjectURL(u) }); };
    im.onerror = () => { clearTimeout(t); URL.revokeObjectURL(u); rej(new Error("decode")); };
    im.src = u;
  });
}
function viaReader(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(r.error);
    r.onload = () => {
      const im = new Image();
      im.onload = () => res({ el: im, w: im.naturalWidth, h: im.naturalHeight, done() {} });
      im.onerror = () => rej(new Error("decode"));
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
async function viaBitmap(file) {
  const b = await createImageBitmap(file);
  return { el: b, w: b.width, h: b.height, done() { if (b.close) b.close(); } };
}
async function processImage(file) {
  let src = null;
  for (const f of [viaImg, viaReader, viaBitmap]) { try { src = await f(file); break; } catch (e) {} }
  if (!src || !src.w || !src.h) throw new Error("unreadable");
  const s = Math.min(1, 600 / Math.max(src.w, src.h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(src.w * s)); c.height = Math.max(1, Math.round(src.h * s));
  const x = c.getContext('2d');
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(src.el, 0, 0, c.width, c.height);
  src.done();
  let out = c.toDataURL('image/jpeg', 0.78);
  if (out.length > 900000) out = c.toDataURL('image/jpeg', 0.5);
  if (!okImg(out) || out.length > 950000) throw new Error("encode");
  return out;
}
async function pick(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  busy = true; $('psave').disabled = true; toast("جارٍ تجهيز الصورة…");
  try {
    pending = await processImage(f);
    $('pprev').src = pending; $('pprev').style.display = "block";
    toast("تم اختيار الصورة ✅");
  } catch (e) {
    pending = null; $('pprev').style.display = "none";
    toast("تعذّرت قراءة الصورة. جرّب صورة أخرى بصيغة JPG أو PNG.");
  }
  busy = false; $('psave').disabled = false;
  try { input.value = ""; } catch (e) {}
}
$('pgal').onclick = () => $('fgal').click();
$('pcam').onclick = () => $('fcam').click();
$('fgal').onchange = () => pick($('fgal'));
$('fcam').onchange = () => pick($('fcam'));

/* ---------- لوحة التحكم ---------- */
function resetForm() {
  editId = null; pending = null;
  ["pname", "pcat", "pprice", "pdesc"].forEach(i => $(i).value = "");
  $('pprev').style.display = "none";
  $('ftitle').textContent = "إضافة منتج";
  $('pcancel').style.display = "none";
}

$('psave').onclick = async () => {
  if (!configured) return toast("اربط Firebase أولًا.");
  if (busy) return toast("انتظر لحظة حتى تجهز الصورة.");
  const name = $('pname').value.trim(), price = $('pprice').value;
  if (!name || price === "") return toast("اكتب اسم المنتج وسعره.");
  const old = products.find(p => p.id === editId);
  const item = {
    name, category: $('pcat').value.trim(), price: +price, desc: $('pdesc').value.trim(),
    image: pending || (old ? old.image || "" : "")
  };
  $('psave').disabled = true; toast("جارٍ الحفظ…");
  try {
    if (old) await updateDoc(doc(db, "products", old.id), item);
    else await addDoc(collection(db, "products"), { ...item, createdAt: serverTimestamp() });
    resetForm(); toast("تم حفظ المنتج ✅");
  } catch (e) { toast(fbErr(e)); }
  $('psave').disabled = false;
};
$('pcancel').onclick = resetForm;

$('plist').onclick = async e => {
  const d = e.target.dataset.d, ed = e.target.dataset.e;
  if (d) {
    if (!e.target.dataset.sure) { e.target.dataset.sure = "1"; e.target.textContent = "تأكيد الحذف"; return; }
    try { await deleteDoc(doc(db, "products", d)); toast("تم الحذف"); } catch (x) { toast(fbErr(x)); }
  }
  if (ed) {
    const p = products.find(p => p.id === ed); if (!p) return;
    editId = p.id; pending = null;
    $('pname').value = p.name || ""; $('pcat').value = p.category || ""; $('pprice').value = p.price; $('pdesc').value = p.desc || "";
    if (okImg(p.image)) { $('pprev').src = p.image; $('pprev').style.display = "block"; } else $('pprev').style.display = "none";
    $('ftitle').textContent = "تعديل المنتج"; $('pcancel').style.display = "inline-block";
    $('ftitle').scrollIntoView({ behavior: "smooth" });
  }
};

$('ssave').onclick = async () => {
  let n = $('swa').value.replace(/\D/g, "");
  if (n.startsWith("00")) n = n.slice(2); else if (n.startsWith("0")) n = "20" + n.slice(1);
  const s = { whatsapp: n || settings.whatsapp, currency: $('scur').value.trim() || settings.currency };
  try { await setDoc(doc(db, "settings", "shop"), s, { merge: true }); toast("تم حفظ الإعدادات ✅"); } catch (e) { toast(fbErr(e)); }
};

$('exp').onclick = () => {
  const out = { ...settings, products: products.map(({ id, createdAt, ...p }) => p) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: "application/json" }));
  a.download = "for-you-backup.json"; document.body.appendChild(a); a.click(); a.remove();
};
$('imp').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.products)) throw new Error("bad");
      toast("جارٍ الاستيراد…");
      for (let i = 0; i < d.products.length; i += 400) {
        const b = writeBatch(db);
        d.products.slice(i, i + 400).forEach(p => b.set(doc(collection(db, "products")), {
          name: String(p.name || ""), category: String(p.category || ""), price: Number(p.price) || 0,
          desc: String(p.desc || ""), image: okImg(p.image) ? p.image : "", createdAt: serverTimestamp()
        }));
        await b.commit();
      }
      toast("تم الاستيراد ✅");
    } catch (x) { toast(x && x.code ? fbErr(x) : "ملف غير صالح."); }
  };
  r.readAsText(f);
  e.target.value = "";
};

/* ---------- تسجيل الدخول ---------- */
$('login').onclick = () => {
  if (!configured) return toast("اربط Firebase أولًا.");
  if (user) { $('admin').scrollIntoView({ behavior: "smooth" }); return; }
  $('lbox').style.display = "block"; $('lmail').focus(); $('lbox').scrollIntoView({ behavior: "smooth" });
};
$('lpass').onkeydown = e => { if (e.key === "Enter") $('lgo').click(); };
$('lgo').onclick = async () => {
  try {
    await signInWithEmailAndPassword(auth, $('lmail').value.trim(), $('lpass').value);
    $('lbox').style.display = "none"; $('lpass').value = "";
  } catch (e) { toast(fbErr(e)); }
};
$('logout').onclick = () => signOut(auth);

$('search').oninput = render;
$('yr').textContent = new Date().getFullYear();

/* ---------- الربط مع Firebase ---------- */
if (configured) {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app); auth = getAuth(app);
  onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")),
    s => { products = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    e => toast(fbErr(e)));
  onSnapshot(doc(db, "settings", "shop"),
    s => { if (s.exists()) settings = { ...settings, ...s.data() }; render(); },
    () => {});
  onAuthStateChanged(auth, u => {
    user = u; $('admin').style.display = u ? "block" : "none";
    if (u) { $('swa').value = settings.whatsapp; $('scur').value = settings.currency; $('admin').scrollIntoView({ behavior: "smooth" }); }
    render();
  });
}
render();
</script>
</body>
</html>
